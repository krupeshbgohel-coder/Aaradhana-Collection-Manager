name: Build Aaradhana APK

on:
  workflow_dispatch:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Extract Android project
        run: |
          unzip Aaradhana_Collection_Manager_GitHub_Fixed.zip -d .

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: android-actions/setup-android@v3

      - name: Install Android SDK
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - uses: gradle/actions/setup-gradle@v4

      - name: Build APK
        working-directory: AaradhanaCollectionManager
        run: gradle assembleDebug

      - uses: actions/upload-artifact@v4
        with:
          name: Aaradhana-Collection-Manager-debug
          path: AaradhanaCollectionManager/app/build/outputs/apk/debug/app-debug.apk
